name: Code Check

on:
  push

jobs:
  check-quality:
    runs-on: ubuntu-latest
    name: Check code quality

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install Node.js 
      uses: actions/setup-node@v6
      with:
        node-version: "24"
    
    - name: Install dependencies
      run: npm install

    - name: Run ESLint
      run: npm run lint

    - name: Run Prettier
      run: npm run format-check